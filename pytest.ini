[pytest]
# Harness de testes — spec 006-harness-testes.
# Config isolada em pytest.ini (NÃO em pyproject.toml) para minimizar conflito
# de merge com as outras ondas. Ver RUNBOOK.md, seção "Testes".
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
# A raiz do projeto entra no sys.path para `import app.*` e `import tests.*`
# funcionarem sem instalar o pacote.
pythonpath = .
# Silencia DeprecationWarnings de código de produção (datetime.utcnow, on_event,
# declarative_base) — não são falhas do harness e o Agente A não altera app/.
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.MovedIn20Warning
